# bin/ops/release.sh settings for purchases (E8-OPS). Sourced by release.sh; from the repository only.
APP=purchases
MIN_PHP_ID=80100
ENTRY=index.php
ENV_FILE=.env
MIGRATE="bin/migrate.php"
SNAPSHOT="bin/db-snapshot.php"
# Runtime folders on the server that a deploy must never delete (rsync protect filters).
# writable/ops/: the heartbeats bin/ops/run-job.php leaves (company-lifecycle).
PROTECT=(/writable/ops/)
# Run once after the switch so the first heartbeat exists before the post-deploy check reads it.
POST_SWITCH=("bin/command-monitor.php")
# Atomic deploys (bin/ops/atomic-switch.sh): the live api/ is a symlink to a complete release folder in
# ~/aicountly-releases/<site>-api/releases/, switched by one rename, so no request ever runs a mix of
# old and new files. PROTECT above is the list of folders the releases share (…/shared/). index.php
# carries the entry guard (bin/ops/atomic-entry.php.txt) and declares no function itself.
ATOMIC=1
