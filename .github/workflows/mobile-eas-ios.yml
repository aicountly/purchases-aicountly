name: Mobile EAS build (iOS)

# Builds the Purchases phone app (mobile/) for iOS on EAS. Started by hand only. Building does not
# submit anything; submission is mobile-eas-submit.yml, which has its own approval gate.
# Secrets: EXPO_TOKEN (the Apple credentials live in EAS).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: eas.json build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: mobile-eas-ios-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx jest --ci
      # The review notes describe only this app and hold no placeholder but the two credential slots.
      - run: node scripts/check-store-copy.mjs

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Repository secret EXPO_TOKEN is not set." >&2; exit 1; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm install -g eas-cli@24.8.0
      - name: Build on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          INPUT_PROFILE: ${{ inputs.profile }}
        run: eas build --platform ios --profile "${INPUT_PROFILE}" --non-interactive --no-wait
